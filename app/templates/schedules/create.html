{% extends "base.html" %}
{% block header %}Novo Agendamento{% endblock %}

{% block content %}
<div class="card" style="max-width:700px;">
    <h3>Criar Novo Agendamento</h3>
    <form method="POST">
        <div class="form-group">
            <label>Prompt</label>
            <select name="prompt_id" required>
                <option value="">Selecione um prompt...</option>
                {% for p in prompts %}
                <option value="{{ p.id }}">{{ p.title }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Descrição</label>
            <input type="text" name="description" required placeholder="Ex: Toda quarta 8AM - Notícias financeiras">
        </div>

        <label style="font-size:13px; color:var(--muted); margin-bottom:5px; display:block;">Construtor de Cron</label>
        <div class="cron-builder">
            <div class="form-group">
                <label>Minuto</label>
                <input type="text" name="minute" value="0" placeholder="0-59">
            </div>
            <div class="form-group">
                <label>Hora</label>
                <input type="text" name="hour" value="8" placeholder="0-23">
            </div>
            <div class="form-group">
                <label>Dia do mês</label>
                <input type="text" name="day" value="*" placeholder="*">
            </div>
            <div class="form-group">
                <label>Mês</label>
                <input type="text" name="month" value="*" placeholder="*">
            </div>
            <div class="form-group">
                <label>Dia da semana</label>
                <input type="text" name="weekday" value="*" placeholder="0-6 (0=Dom)">
            </div>
        </div>

        <div class="form-group">
            <label>Email Destino</label>
            <input type="email" name="email_to" required placeholder="seuemail@gmail.com">
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="/schedules" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
