{% extends "base.html" %}
{% block header %}Editar Prompt{% endblock %}

{% block content %}
<div class="card" style="max-width:700px;">
    <h3>Editar Prompt</h3>
    <form method="POST">
        <div class="form-group">
            <label>Título</label>
            <input type="text" name="title" required value="{{ prompt.title }}">
        </div>
        <div class="form-group">
            <label>Conteúdo do Prompt</label>
            <textarea name="content" required>{{ prompt.content }}</textarea>
        </div>
        <div class="form-group">
            <label>Tom / Estilo</label>
            <select name="tone">
                {% for tone in ['infografico', 'resumo', 'newsletter', 'analise'] %}
                <option value="{{ tone }}" {% if prompt.tone == tone %}selected{% endif %}>{{ tone|capitalize }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Formato de Saída</label>
            <select name="format">
                <option value="html" selected>HTML (email)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Ativo</label>
            <select name="active">
                <option value="1" {% if prompt.active %}selected{% endif %}>Sim</option>
                <option value="0" {% if not prompt.active %}selected{% endif %}>Não</option>
            </select>
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" name="enable_search" value="1"
                       {% if prompt.enable_search %}checked{% endif %}>
                Ativar busca web antes do DeepSeek
            </label>
            <small style="color:var(--muted);display:block;margin-left:24px;">Busca notícias atualizadas e envia como contexto ao modelo</small>
        </div>
        <div class="form-group">
            <label>Resultados da busca</label>
            <input type="number" name="search_max_results"
                   value="{{ prompt.search_max_results or 5 }}" min="1" max="20"
                   style="width:80px;">
            <small style="color:var(--muted);">Quantidade de resultados (1-20)</small>
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="/prompts" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
