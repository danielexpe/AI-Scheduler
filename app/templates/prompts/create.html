{% extends "base.html" %}
{% block header %}Novo Prompt{% endblock %}

{% block content %}
<div class="card" style="max-width:700px;">
    <h3>Criar Novo Prompt</h3>
    <form method="POST">
        <div class="form-group">
            <label>Título</label>
            <input type="text" name="title" required placeholder="Ex: Novidades do mercado financeiro">
        </div>
        <div class="form-group">
            <label>Conteúdo do Prompt</label>
            <textarea name="content" required placeholder="Descreva o que você quer... Ex: Me envie as principais notícias do mercado financeiro brasileiro, com foco em ações, câmbio e taxa de juros."></textarea>
        </div>
        <div class="form-group">
            <label>Tom / Estilo</label>
            <select name="tone">
                <option value="infografico">Infográfico</option>
                <option value="resumo">Resumo</option>
                <option value="newsletter">Newsletter</option>
                <option value="analise">Análise</option>
            </select>
        </div>
        <div class="form-group">
            <label>Formato de Saída</label>
            <select name="format">
                <option value="html">HTML (email)</option>
            </select>
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" name="enable_search" value="1" checked>
                Ativar busca web antes do DeepSeek
            </label>
            <small style="color:var(--muted);display:block;margin-left:24px;">Busca notícias atualizadas e envia como contexto ao modelo</small>
        </div>
        <div class="form-group">
            <label>Resultados da busca</label>
            <input type="number" name="search_max_results" value="5" min="1" max="20" style="width:80px;">
            <small style="color:var(--muted);">Quantidade de resultados (1-20)</small>
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" name="debug_mode" value="1">
                Ativar modo debug
            </label>
            <small style="color:var(--muted);display:block;margin-left:24px;">Inclui a trilha completa do prompt no email (system + user prompt)</small>
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="/prompts" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
